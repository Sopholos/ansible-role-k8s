apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.cronJob.name }}
  namespace: {{ .Values.namespace }}
spec:
  schedule: {{ .Values.cronJob.schedule }}
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            etcd: "yes"
          serviceAccountName: {{ .Values.serviceAccount.name }}
          {{- if .Values.image.credentials }}
          imagePullSecrets:
            - name: {{ .Chart.Name }}-registrykey
          {{- end }}
          containers:
          - name: {{ .Values.cronJob.name }}
            image: "{{ .Values.image.registry }}/{{ .Values.image.project }}/{{ .Values.image.name }}:{{ .Values.image.tag  }}"
            imagePullPolicy: {{ .Values.image.pullPolicy }}
            command: ["/bin/sh","-c"]
            args:
              - |
                date
                etcdctl snapshot save {{ .Values.cronJob.backupDir }}/etcd-backup.db \
                --cacert /etc/kubernetes/pki/etcd/ca.crt \
                --cert /etc/kubernetes/pki/etcd/peer.crt \
                --key /etc/kubernetes/pki/etcd/peer.key \
                --endpoints $NODE_IP:2379
            env:
              - name: NODE_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
            volumeMounts:
              - name: backup-volume
                mountPath: {{ .Values.cronJob.backupDir }}
              - name: etcd-certs
                mountPath: /etc/kubernetes/pki/etcd/
          restartPolicy: OnFailure
          volumes:
            - name: backup-volume
              hostPath:
                path: /backup_etcd
                type: DirectoryOrCreate
            - name: etcd-certs
              hostPath:
                path: /etc/kubernetes/pki/etcd/
                type: DirectoryOrCreate