- block:
    - name: Get current worker nodes from the cluster
      command: kubectl get nodes --selector node-role.kubernetes.io/control-plane!= -o jsonpath='{.items[*].metadata.name}'
      register: current_worker_nodes
    - name: Set current_worker_nodes
      set_fact:
        current_worker_nodes_str: "{{ current_worker_nodes.stdout.split() }}"
    - name: Set worker_nodes_to_add
      set_fact:
        worker_nodes_to_add: "{{ groups['worker_nodes'] | difference(current_worker_nodes_str) }}"
    - name: Set worker_nodes_to_remove
      set_fact:
        worker_nodes_to_remove: "{{ current_worker_nodes_str | difference(groups['worker_nodes']) }}"
    - debug: 
        msg: 
          - "cur worker nodes {{ current_worker_nodes_str }}"
          - "inventory worker nodes {{groups['worker_nodes']}}"
          - "need to add {{ worker_nodes_to_add }}"
          - "need to del {{ worker_nodes_to_remove }}" 
  delegate_to: "{{ first_control_plane }}"
  run_once: true

- name: 'Set fact worker_nodes_to_add'
  ansible.builtin.set_fact:
    nodes_to_add: "{{ worker_nodes_to_add }}"
  delegate_to: "{{ k8s_member }}"
  delegate_facts: true
  loop: "{{ groups['worker_nodes'] }}"
  loop_control:
    loop_var: 'k8s_member'

# Delete worker nodes
- name: Delete worker nodes
  shell: |
    kubectl cordon {{ item }}
    kubectl drain {{ item }} --ignore-daemonsets --force
    kubectl delete node {{ item }}
  loop: "{{ worker_nodes_to_remove }}"
  delegate_to: "{{ first_control_plane }}"
  run_once: true
  when: >
    worker_nodes_to_remove is defined and
    (worker_nodes_to_remove|length>0)

# Add worker nodes
- block:  
    - name: get tokens
      include_tasks:
        file: get_tokens.yml
      when: inventory_hostname == first_control_plane
    - name: tasks for join nodes
      include_tasks:
        file: join_node.yml
      when: inventory_hostname in worker_nodes_to_add
    - name: clean tokens
      include_tasks:
        file: clean_tokens.yml
      when: inventory_hostname == first_control_plane
    - name: Install soft on k8s member
      include_tasks:
        file: install_soft_k8s_member.yml
  when: >
    worker_nodes_to_add is defined and
    (worker_nodes_to_add|length>0)

# Show status
- name: Add show status
  include_tasks: show_k8s.yml
  when: inventory_hostname == first_control_plane