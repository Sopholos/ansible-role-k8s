- block:
    - debug: msg="control-plane endpoint {{ k8s_endpoint }}"
    - name: Init k8s cluster
      command: "kubeadm init --control-plane-endpoint={{ k8s_endpoint }}:{{ k8s_controlplane_port }}"
    - name: Create kube directory
      ansible.builtin.file:
        path: /root/.kube
        state: directory
    - name: Copy admin.conf
      command: cp /etc/kubernetes/admin.conf /root/.kube/config 
  when: >
    inventory_hostname == first_control_plane and
    not kubelet_conf['stat']['exists']

- name: Get tokens
  include_tasks:
    file: get_tokens.yml  
  when: inventory_hostname == first_control_plane

- name: tasks for join nodes
  include_tasks:
    file: join_node.yml
  when: >
    inventory_hostname != first_control_plane and
    not kubelet_conf['stat']['exists']

- name: clean tokens
  include_tasks:
    file: clean_tokens.yml
    apply:
      tags: ['install','init']
  tags: ['install','init']
  when: inventory_hostname == first_control_plane

- block:
    - name: Костыль для выдачи прав
      shell: chown root. -R /opt/cni/bin 
    - name: "install helm"
      shell: |
        wget -O helmbins.tar.gz https://get.helm.sh/helm-v3.14.3-linux-amd64.tar.gz
        mkdir helmbins
        tar Cxzvf helmbins helmbins.tar.gz
        mv helmbins/linux-amd64/helm /usr/local/bin/helm
        rm -rf helmbins helmbins.tar.gz
    - name: install k9s
      shell: |
        wget -O k9s.deb https://github.com/derailed/k9s/releases/download/v0.32.3/k9s_linux_amd64.deb && 
        dpkg -i k9s.deb
  when: > 
    inventory_hostname in groups['control_planes'] and
    not kubelet_conf['stat']['exists']

- block:
    - name: get pods in kube-system
      shell: kubectl get pods --no-headers -o custom-columns=":metadata.name" --all-namespaces
      register: pods_system
      changed_when: false
    - name: install cilium CNI
      shell: |
        CILIUM_CLI_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)
        CLI_ARCH=amd64
        if [ "$(uname -m)" = "aarch64" ]; then CLI_ARCH=arm64; fi
        curl -L --fail --remote-name-all https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz{,.sha256sum}
        sha256sum --check cilium-linux-${CLI_ARCH}.tar.gz.sha256sum
        sudo tar xzvfC cilium-linux-${CLI_ARCH}.tar.gz /usr/local/bin
        rm cilium-linux-${CLI_ARCH}.tar.gz{,.sha256sum}
        cilium install --version 1.16.1
      when: pods_system.stdout.find('cilium') == -1
    - name: install ingress
      shell: |
        kubectl create namespace ingress-nginx --dry-run=client -o yaml | kubectl apply -f -
        helm install ingress-nginx oci://ghcr.io/nginxinc/charts/nginx-ingress --version 1.3.2 --namespace ingress-nginx
      when: pods_system.stdout.find('ingress-nginx') == -1
  when: inventory_hostname == first_control_plane