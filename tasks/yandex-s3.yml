- name: Install CSI
  shell: |
    helm repo add yandex-s3 https://yandex-cloud.github.io/k8s-csi-s3/charts
    helm upgrade --install \
    --namespace kube-system \
    --set storageClass.singleBucket={{ yandex_s3_bucket }} \
    --set secret.accessKey={{ yandex_s3_key }} \
    --set secret.secretKey={{ yandex_s3_secret }} \
    csi-s3 yandex-s3/csi-s3

