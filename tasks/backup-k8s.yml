- name: Get time
  shell: date "+%Y-%m-%d_%H_%M_%S"
  register: time

- name: Set time env 
  set_fact:
    timestamp: "{{ time.stdout }}"

- name: Get etcd members
  shell: |
    ETCDCTL_API=3 etcdctl \
    --cacert /etc/kubernetes/pki/etcd/ca.crt \
    --cert /etc/kubernetes/pki/etcd/peer.crt \
    --key /etc/kubernetes/pki/etcd/peer.key \
    member list
  register: etcd_members

- name: Ensures {{ backup_dir }} dir exists
  file:
    path: "{{ backup_dir }}"
    state: directory

- name: Create backup file with members
  copy: 
    content: "{{ etcd_members.stdout_lines | join('\n') }}"
    dest: "{{ backup_dir }}/members-{{ timestamp }}.txt"

- name: Backup etcd
  shell: |
    mkdir -p {{ backup_dir }}
    sudo ETCDCTL_API=3 etcdctl \
    --cacert=/etc/kubernetes/pki/etcd/ca.crt \
    --cert=/etc/kubernetes/pki/etcd/peer.crt \
    --key=/etc/kubernetes/pki/etcd/peer.key \
    snapshot save {{ backup_dir }}/etcd-{{ timestamp }}.db
  when: inventory_hostname == first_control_plane

- name: Backup all namespaces
  shell: |
    kubectl get all --all-namespaces -o yaml > \
    {{ backup_dir }}/all-resources-backup-{{ timestamp }}.yaml

- name: Backup ca.crt
  shell: cp /etc/kubernetes/pki/etcd/ca.crt {{ backup_dir }}/ca-{{ timestamp }}.crt
  when: inventory_hostname == first_control_plane

- name: Get backup files
  shell: (cd {{ backup_dir }}; find . -name "*db" -o -name "*yaml" -type f) | cut -d'/' -f2
  register: files_to_copy

- name: Copy yaml with all resources backup to local
  fetch: 
    src: "{{ backup_dir }}/all-resources-backup-{{ timestamp }}.yaml"
    dest: "{{ backup_ansible_dir }}/"
    flat: true

- name: Copy etcd backup to local
  fetch: 
    src: "{{ backup_dir }}/etcd-{{ timestamp }}.db"
    dest: "{{ backup_ansible_dir }}/"
    flat: true
  when: inventory_hostname == first_control_plane

- name: Copy etcd members to local
  fetch: 
    src: "{{ backup_dir }}/members-{{ timestamp }}.txt"
    dest: "{{ backup_ansible_dir }}/"
    flat: true
  when: inventory_hostname == first_control_plane

- name: Copy ca.crt backup to local
  fetch: 
    src: "{{ backup_dir }}/ca-{{ timestamp }}.crt"
    dest: "{{ backup_ansible_dir }}/"
    flat: true
  when: inventory_hostname == first_control_plane
