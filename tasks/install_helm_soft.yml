- block:
    - name: Get installed helm charts
      shell: helm list --all-namespaces | awk '{print $1}'
      register: helm_list

    - debug: msg="{{ helm_list.stdout_lines }}"

    - block:
        - name: Add zabbix repo and set parameters
          shell: |
            helm repo add zabbix-chart-{{ zabbix_monitoring_version }} https://cdn.zabbix.com/zabbix/integrations/kubernetes-helm/{{ zabbix_monitoring_version }}
            helm show values zabbix-chart-6.4/zabbix-helm-chrt > ~/zabbix_values.yaml
        - name: Set parameters to zabbix config (оставляем только сервисный аккаунт, остальное отключаем)
          shell: |
            printf '%s\n' '/zabbixAgent//enabled: true/s//enabled: false/' x | ex ~/zabbix_values.yaml
            printf '%s\n' '/zabbixProxy//enabled: true/s//enabled: false/' x | ex ~/zabbix_values.yaml
            printf '%s\n' '/kube-state-metrics//enabled: true/s//enabled: false/' x | ex ~/zabbix_values.yaml
        - name: Install zabbix monitoring
          shell: |
            cd ~/kubernetes-helm/
            kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
            helm install zabbix zabbix-chart-{{ zabbix_monitoring_version }}/zabbix-helm-chrt --dependency-update -f ~/zabbix_values.yaml -n monitoring       
        - name: Get secret
          shell: kubectl get secret zabbix-service-account -n monitoring -o jsonpath={.data.token} | base64 -d
          register: zabbix_secret
        - debug: msg="{{ zabbix_secret.stdout }}"
      when: "'zabbix' not in helm_list.stdout_lines"

    - block:
        - name: Download kubernetes-dashboard
          shell: |
            cd ~
            helm repo add kubernetes-dashboard https://kubernetes.github.io/dashboard/
            helm upgrade --install kubernetes-dashboard \
            --set kong.proxy.type=NodePort kubernetes-dashboard/kubernetes-dashboard \
            --create-namespace --namespace kubernetes-dashboard
        - name: Copy files to remote
          copy:
            src: "{{ item }}"
            dest: ~/
          with_fileglob: "dashboard_*"
        - name: Create users
          shell: kubectl apply -f ~/dashboard_users.yaml
        - name: Show token
          shell: kubectl -n kube-system create token admin-user
          register: dashboard_token
        - debug: msg="{{ dashboard_token.stdout }}"
        # kubectl -n kube-system create token admin-user
      when: "'kubernetes-dashboard' not in helm_list.stdout_lines"

    - block:
        - name: Copy helm_charts/etcd_backup
          copy:
            src: helm_charts/
            dest: ~/helm_charts/
        - name: Helm package
          shell: helm package ~/helm_charts/etcd_backup
        - name: Helm install
          shell: |
            helm install etcd-backup ~/helm_charts/etcd_backup --namespace kube-system
      when: "'etcd-backup' not in helm_list.stdout_lines"

  when: inventory_hostname == first_control_plane