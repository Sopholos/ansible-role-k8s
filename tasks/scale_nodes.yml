---    
- block:
    - name: Get current worker nodes from the cluster
      command: kubectl get nodes --selector node-role.kubernetes.io/control-plane!= -o jsonpath='{.items[*].metadata.name}'
      register: current_nodes
      changed_when: false

    - name: Convert current nodes to a list
      set_fact:
        current_worker_nodes: "{{ current_nodes.stdout.split() }}"

    - name: Determine nodes to add
      set_fact:
        nodes_to_add: "{{ groups['worker_nodes'] | difference(current_worker_nodes) }}"

    - name: Determine nodes to remove
      set_fact:
        nodes_to_remove: "{{ current_worker_nodes | difference(groups['worker_nodes']) }}"

    - debug: 
        msg: 
          - "cur worker nodes {{ current_worker_nodes }}"
          - "inventory worker nodes {{groups['worker_nodes']}}"
          - "need to add {{ nodes_to_add }}"
          - "need to del {{ nodes_to_remove }}"  

    - name: 'Set fact nodes_to_add'
      ansible.builtin.set_fact:
        nodes_to_add: "{{ nodes_to_add }}"
      delegate_to: "{{ k8s_member }}"
      delegate_facts: true
      loop: "{{ groups['worker_nodes'] }}"
      loop_control:
        loop_var: 'k8s_member'
  
  when: > 
    inventory_hostname == first_control_plane and
    'del-cp' not in ansible_run_tags and
    'add-cp' not in ansible_run_tags

- name: set nodes_to_remove
  ansible.builtin.set_fact:
    nodes_to_remove: "{{ cp | split }}"
  when: "'del-cp' in ansible_run_tags"
  
- name: set nodes_to_add
  ansible.builtin.set_fact:
    nodes_to_add: "{{ cp | split }}"
  when: "'add-cp' in ansible_run_tags"

- block:
    # Delete worker nodes
    - name: 'Cordon node'
      ansible.builtin.command: "kubectl cordon {{ item }}"
      loop: "{{ nodes_to_remove }}"
    - name: 'Drain node'
      ansible.builtin.command: "kubectl drain {{ item }} --ignore-daemonsets"
      loop: "{{ nodes_to_remove }}"
    - name: 'Delete node'
      ansible.builtin.command: "kubectl delete node {{ item }}"
      loop: "{{ nodes_to_remove }}"
  when: >
    inventory_hostname == first_control_plane and
    nodes_to_remove is defined

- block:
    - name: Get id of removed control plane from etcd
      shell: "kubectl exec etcd-kub-mn-t-01 -n kube-system -- 
               etcdctl --cacert /etc/kubernetes/pki/etcd/ca.crt \
               --cert /etc/kubernetes/pki/etcd/peer.crt \
               --key /etc/kubernetes/pki/etcd/peer.key \
               member list | grep {{ cp }} | cut -d, -f1"
      register: id_cp
    - name: Set fact with id_cp
      ansible.builtin.set_fact:
        id_cp_str: "{{ id_cp.stdout }}"
    - name: Delete peer from etcd
      shell:  "kubectl exec etcd-kub-mn-t-01 -n kube-system --
                etcdctl --cacert /etc/kubernetes/pki/etcd/ca.crt \
                --cert /etc/kubernetes/pki/etcd/peer.crt \
                --key /etc/kubernetes/pki/etcd/peer.key \
                member remove {{ id_cp_str }}"
      when: id_cp_str is defined
  when: >
    'del-cp' in ansible_run_tags and
    inventory_hostname == first_control_plane
  
- block:  
    # Add nodes
    - name: get tokens
      include_tasks:
        file: get_tokens.yml
      when: inventory_hostname == first_control_plane

    - name: tasks for join nodes
      include_tasks:
        file: join_node.yml
      when: inventory_hostname in nodes_to_add

    - name: clean tokens
      include_tasks:
        file: clean_tokens.yml
      when: inventory_hostname == first_control_plane

  when: nodes_to_add is defined
  
- name: Add show status
  include_tasks: show_k8s.yml
  when: inventory_hostname == first_control_plane